<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Client Portal</title>
    <link rel="stylesheet" href="dracula.css">
  </head>
  <body>
    <header>
      <h1>Client Portal</h1>
      <nav>
        <a href="#" aria-current="page">Dashboard</a>
        <a href="#">Projects</a>
        <a href="#">Invoices</a>
        <a href="#">Support</a>
      </nav>
    </header>

    <main>
      <h2>Welcome back</h2>
      <p class="muted">Here's a quick look at your account.</p>

      <section class="cards">
        <div class="card">
          <h3>Projects</h3>
          <p>Website redesign <span class="badge ok">On track</span></p>
        </div>
        <div class="card">
          <h3>Invoices</h3>
          <p>#1042 <span class="badge due">Due</span></p>
        </div>
        <div class="card">
          <h3>Support</h3>
          <p>1 open ticket <span class="badge pending">Pending</span></p>
        </div>
      </section>

      <p style="margin-top: 32px;"><a class="btn" href="#">Contact your account manager</a></p>
    </main>

    <footer>&copy; Client Portal</footer>
  </body>
</html>
